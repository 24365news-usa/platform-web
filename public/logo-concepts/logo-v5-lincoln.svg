<svg width="450" height="120" viewBox="0 0 450 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Lincoln-inspired with new tagline -->
  <defs>
    <linearGradient id="patriotGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#DC2626"/>
      <stop offset="100%" style="stop-color:#2563EB"/>
    </linearGradient>
  </defs>
  
  <!-- Main number in bold red -->
  <text x="20" y="60" font-family="Arial Black, sans-serif" font-size="52" font-weight="900" fill="#DC2626">24365</text>
  
  <!-- .News in white -->
  <text x="230" y="60" font-family="Arial, sans-serif" font-size="42" font-weight="300" fill="#FFFFFF">.</text>
  <text x="250" y="60" font-family="Arial, sans-serif" font-size="42" font-weight="600" fill="#FFFFFF">News</text>
  
  <!-- Divider line -->
  <line x1="20" y1="75" x2="380" y2="75" stroke="url(#patriotGrad)" stroke-width="2"/>
  
  <!-- Lincoln tagline -->
  <text x="20" y="100" font-family="Georgia, serif" font-size="16" font-style="italic" fill="#94A3B8">News for the people, by the people</text>
</svg>
